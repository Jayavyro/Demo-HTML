<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avyro Demos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Simple Top Bar */
    .topbar {
      height: 64px;
      flex: 0 0 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }

    .brand {
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: #475569;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: #f8fafc;
      color: #0f172a;
    }

    .nav-btn.active {
      background: #0f172a;
      color: #ffffff;
    }

    /* Main Area */
    .main {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background: #ffffff;
    }

    /* All Demos View — Lots of White Space */
    .all-demos-view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      display: flex;
       flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 40px;
      background: #ffffff;
    }

    .all-demos-view.hidden {
      display: none;
    }

    .hub-wrap {
      width: 100%;
      max-width: 980px;
      text-align: center;
    }

    .hub-title {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0f172a;
      margin-bottom: 56px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 48px 32px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
      min-height: 240px;
    }

    .card:hover {
      border-color: #94a3b8;
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.05);
    }

    .card-number {
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .card-name {
      font-size: 20px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 36px;
      letter-spacing: -0.01em;
    }

    .show-btn {
      width: 100%;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid #0f172a;
      background: #ffffff;
      color: #0f172a;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .card:hover .show-btn {
      background: #0f172a;
      color: #ffffff;
    }

    /* Demo Player View */
    .player-view {
      position: absolute;
      inset: 0;
      display: none;
      background: #ffffff;
    }

    .player-view.active {
      display: block;
    }

    .demo-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
    }

    .demo-frame.active {
      display: block;
    }

    @media (max-width: 820px) {
      .topbar {
        padding: 0 20px;
      }

      .all-demos-view {
        justify-content: flex-start;
        padding: 48px 20px;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <a href="#all" class="brand" id="homeLink">Avyro</a>

      <nav class="nav-buttons" aria-label="Demos">
        <button class="nav-btn active" type="button" data-demo="all">All Demos</button>
        <button class="nav-btn" type="button" data-demo="crm">CRM</button>
        <button class="nav-btn" type="button" data-demo="pm">Project Management</button>
        <button class="nav-btn" type="button" data-demo="billing">Billing</button>
      </nav>
    </header>

    <main class="main">
      <!-- All Demos View -->
      <section class="all-demos-view" id="allDemosView">
        <div class="hub-wrap">
          <h1 class="hub-title">Select a Demo</h1>

          <div class="cards">
            <div class="card" data-demo="crm" tabindex="0" role="button">
              <div>
                <div class="card-number">01</div>
                <div class="card-name">CRM</div>
              </div>
              <button class="show-btn" type="button" data-demo="crm">Show Demo</button>
            </div>

            <div class="card" data-demo="pm" tabindex="0" role="button">
              <div>
                <div class="card-number">02</div>
                <div class="card-name">Project Management</div>
              </div>
              <button class="show-btn" type="button" data-demo="pm">Show Demo</button>
            </div>

            <div class="card" data-demo="billing" tabindex="0" role="button">
              <div>
                <div class="card-number">03</div>
                <div class="card-name">Billing</div>
              </div>
              <button class="show-btn" type="button" data-demo="billing">Show Demo</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Embedded Demo View -->
      <section class="player-view" id="playerView">
        <iframe class="demo-frame" id="frame-crm" data-src="CRM/crm-demo.html" title="CRM Demo" allow="fullscreen"></iframe>
        <iframe class="demo-frame" id="frame-pm" data-src="Project%20Management/index.html" title="Project Management Demo" allow="fullscreen"></iframe>
        <iframe class="demo-frame" id="frame-billing" data-src="Billing/billing-demo.html" title="Billing Demo" allow="fullscreen"></iframe>
      </section>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const allDemosView = document.getElementById("allDemosView");
      const playerView = document.getElementById("playerView");
      const navButtons = document.querySelectorAll(".nav-btn");
      const frames = {
        crm: document.getElementById("frame-crm"),
        pm: document.getElementById("frame-pm"),
        billing: document.getElementById("frame-billing")
      };

      let activeDemo = "all";

      function showDemo(key) {
        if (!frames[key]) key = "all";
        activeDemo = key;

        navButtons.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.demo === key);
        });

        if (key === "all") {
          allDemosView.classList.remove("hidden");
          playerView.classList.remove("active");
        } else {
          allDemosView.classList.add("hidden");
          playerView.classList.add("active");

          Object.entries(frames).forEach(([id, frame]) => {
            if (id === key) {
              if (!frame.getAttribute("src")) {
                frame.setAttribute("src", frame.getAttribute("data-src"));
              }
              frame.classList.add("active");
              setTimeout(() => {
                try {
                  frame.focus();
                  frame.contentWindow?.focus();
                } catch (_) {}
              }, 50);
            } else {
              frame.classList.remove("active");
            }
          });
        }
      }

      document.querySelectorAll("[data-demo]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          showDemo(el.getAttribute("data-demo"));
        });
      });

      document.getElementById("homeLink").addEventListener("click", (e) => {
        e.preventDefault();
        showDemo("all");
      });

      window.addEventListener("keydown", (e) => {
        if (activeDemo !== "all") {
          const frame = frames[activeDemo];
          if (frame && frame.contentDocument && ["ArrowRight", "ArrowLeft", " ", "Enter", "r", "R", "f", "F"].includes(e.key)) {
            e.preventDefault();
            frame.contentDocument.dispatchEvent(
              new KeyboardEvent("keydown", { key: e.key, bubbles: true, cancelable: true })
            );
          }
        }
      });
    })();
  </script>
</body>

</html>
