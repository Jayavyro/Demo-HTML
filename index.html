<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avyro Demos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      color: #0f172a;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* ---------- Clean Centered Navbar ---------- */
    .navbar {
      height: 56px;
      flex: 0 0 56px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 28px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      z-index: 30;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    /* Adaptive dark navbar when a dark demo is active */
    body.demo-active .navbar {
      background: #070b19;
      border-bottom-color: rgba(148, 163, 184, 0.16);
    }

    /* Left: Brand */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #0f172a;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      justify-self: start;
      transition: color 0.2s ease;
    }

    body.demo-active .brand {
      color: #f8fafc;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(135deg, #f97316, #ec4899 40%, #7c3aed 70%, #2563eb);
      flex-shrink: 0;
    }

    /* Center: Segmented Pill Navigation */
    .nav-pills {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 10px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      justify-self: center;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    body.demo-active .nav-pills {
      background: rgba(15, 23, 42, 0.9);
      border-color: rgba(148, 163, 184, 0.2);
    }

    .nav-btn {
      padding: 6px 14px;
      border-radius: 7px;
      border: 0;
      background: transparent;
      color: #475569;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.16s ease;
    }

    .nav-btn:hover {
      color: #0f172a;
      background: rgba(255, 255, 255, 0.6);
    }

    body.demo-active .nav-btn {
      color: #94a3b8;
    }

    body.demo-active .nav-btn:hover {
      color: #f8fafc;
      background: rgba(51, 65, 85, 0.45);
    }

    .nav-btn.active {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
    }

    body.demo-active .nav-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }

    /* Right: Minimal Action */
    .nav-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #475569;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .icon-btn:hover {
      color: #0f172a;
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    body.demo-active .icon-btn {
      background: rgba(30, 41, 59, 0.7);
      border-color: rgba(148, 163, 184, 0.24);
      color: #cbd5e1;
    }

    body.demo-active .icon-btn:hover {
      background: rgba(51, 65, 85, 0.9);
      color: #ffffff;
    }

    /* ---------- Main Content ---------- */
    .main {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background: #ffffff;
    }

    /* All Demos View — Simple, Planar, Lots of White Space */
    .all-demos-view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
      background: #ffffff;
      z-index: 2;
    }

    .all-demos-view.hidden {
      display: none;
    }

    .hub-wrap {
      width: 100%;
      max-width: 1160px;
      text-align: center;
    }

    .hub-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0f172a;
      margin-bottom: 48px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 24px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      cursor: pointer;
      min-height: 220px;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      border-color: #94a3b8;
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.05);
    }

    .card-number {
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    .card-name {
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 30px;
      letter-spacing: -0.01em;
    }

    .show-btn {
      width: 100%;
      padding: 11px 16px;
      border-radius: 8px;
      border: 1px solid #0f172a;
      background: #ffffff;
      color: #0f172a;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .card:hover .show-btn {
      background: #0f172a;
      color: #ffffff;
    }

    /* Demo Player View */
    .player-view {
      position: absolute;
      inset: 0;
      background: #050814;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .player-view.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .demo-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .demo-frame.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 1024px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }

    @media (max-width: 820px) {
      .navbar {
        grid-template-columns: auto 1fr;
        gap: 12px;
        padding: 0 16px;
      }

      .nav-right {
        display: none;
      }

      .nav-pills {
        justify-self: end;
        overflow-x: auto;
        max-width: 100%;
      }

      .all-demos-view {
        justify-content: flex-start;
        padding: 40px 16px;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="navbar">
      <a href="#all" class="brand" id="homeLink">
        <span class="brand-logo" aria-hidden="true"></span>
        <span>Avyro</span>
      </a>

      <nav class="nav-pills" aria-label="Demos">
        <button class="nav-btn active" type="button" data-demo="all">All Demos</button>
        <button class="nav-btn" type="button" data-demo="crm">CRM</button>
        <button class="nav-btn" type="button" data-demo="pm">Project Management</button>
        <button class="nav-btn" type="button" data-demo="billing">Billing</button>
        <button class="nav-btn" type="button" data-demo="team">Team Productivity</button>
      </nav>

      <div class="nav-right">
        <button class="icon-btn" type="button" id="fullscreenBtn">Fullscreen</button>
      </div>
    </header>

    <main class="main">
      <!-- All Demos View -->
      <section class="all-demos-view" id="allDemosView">
        <div class="hub-wrap">
          <h1 class="hub-title">Select a Demo</h1>

          <div class="cards">
            <div class="card" data-demo="crm" tabindex="0" role="button">
              <div>
                <div class="card-number">01</div>
                <div class="card-name">CRM</div>
              </div>
              <button class="show-btn" type="button" data-demo="crm">Show Demo</button>
            </div>

            <div class="card" data-demo="pm" tabindex="0" role="button">
              <div>
                <div class="card-number">02</div>
                <div class="card-name">Project Management</div>
              </div>
              <button class="show-btn" type="button" data-demo="pm">Show Demo</button>
            </div>

            <div class="card" data-demo="billing" tabindex="0" role="button">
              <div>
                <div class="card-number">03</div>
                <div class="card-name">Billing</div>
              </div>
              <button class="show-btn" type="button" data-demo="billing">Show Demo</button>
            </div>

            <div class="card" data-demo="team" tabindex="0" role="button">
              <div>
                <div class="card-number">04</div>
                <div class="card-name">Team Productivity</div>
              </div>
              <button class="show-btn" type="button" data-demo="team">Show Demo</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Embedded Demo View -->
      <section class="player-view" id="playerView">
        <iframe class="demo-frame" id="frame-crm" data-src="CRM/crm-demo.html" title="CRM Demo" allow="fullscreen"></iframe>
        <iframe class="demo-frame" id="frame-pm" data-src="Project%20Management/index.html" title="Project Management Demo" allow="fullscreen"></iframe>
        <iframe class="demo-frame" id="frame-billing" data-src="Billing/billing-demo.html" title="Billing Demo" allow="fullscreen"></iframe>
        <iframe class="demo-frame" id="frame-team" data-src="Team%20Productivity/team-productivity-demo.html" title="Team Productivity Demo" allow="fullscreen"></iframe>
      </section>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const allDemosView = document.getElementById("allDemosView");
      const playerView = document.getElementById("playerView");
      const navButtons = document.querySelectorAll(".nav-btn");
      const fullscreenBtn = document.getElementById("fullscreenBtn");
      const frames = {
        crm: document.getElementById("frame-crm"),
        pm: document.getElementById("frame-pm"),
        billing: document.getElementById("frame-billing"),
        team: document.getElementById("frame-team")
      };

      let activeDemo = "all";

      function showDemo(key, updateHash = true) {
        if (!frames[key]) key = "all";
        activeDemo = key;

        navButtons.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.demo === key);
        });

        document.body.classList.toggle("demo-active", key !== "all");

        if (key === "all") {
          allDemosView.classList.remove("hidden");
          playerView.classList.remove("active");
        } else {
          allDemosView.classList.add("hidden");
          playerView.classList.add("active");

          Object.entries(frames).forEach(([id, frame]) => {
            if (id === key) {
              if (!frame.getAttribute("src")) {
                frame.setAttribute("src", frame.getAttribute("data-src"));
              }
              frame.classList.add("active");
              requestAnimationFrame(() => {
                try {
                  frame.contentWindow?.dispatchEvent(new Event("resize"));
                  frame.focus();
                  frame.contentWindow?.focus();
                } catch (_) {}
              });
            } else {
              frame.classList.remove("active");
            }
          });
        }

        if (updateHash) {
          const hash = key === "all" ? "#all" : "#" + key;
          if (location.hash !== hash) {
            history.replaceState(null, "", hash);
          }
        }
      }

      document.querySelectorAll("[data-demo]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          showDemo(el.getAttribute("data-demo"));
        });
      });

      document.getElementById("homeLink").addEventListener("click", (e) => {
        e.preventDefault();
        showDemo("all");
      });

      window.addEventListener("load", () => {
        const hash = (location.hash || "").replace("#", "").toLowerCase();
        if (hash && (hash === "all" || frames[hash])) {
          showDemo(hash, false);
        }
      });

      window.addEventListener("hashchange", () => {
        const hash = (location.hash || "").replace("#", "").toLowerCase();
        showDemo(hash || "all", false);
      });

      fullscreenBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.();
        } else {
          document.exitFullscreen?.();
        }
      });

      window.addEventListener("keydown", (e) => {
        if (activeDemo !== "all") {
          const frame = frames[activeDemo];
          if (frame && frame.contentDocument && ["ArrowRight", "ArrowLeft", " ", "Enter", "r", "R", "f", "F"].includes(e.key)) {
            e.preventDefault();
            frame.contentDocument.dispatchEvent(
              new KeyboardEvent("keydown", { key: e.key, bubbles: true, cancelable: true })
            );
          }
        }
      });
    })();
  </script>
</body>

</html>
